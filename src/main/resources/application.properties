spring.datasource.url= jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username= ${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto= update

# App Properties
app.jwtAccessCookieName= userInfo
app.jwtRefreshCookieName= refreshInfo
app.jwtSecret=${JWT_SECRET}
app.jwtExpirationAccessMs= 900000
app.jwtExpirationRefreshMs= 604800000