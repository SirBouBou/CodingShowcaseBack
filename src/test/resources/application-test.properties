# H2 - base de données en mémoire
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# App Properties
app.cookie.secure=${COOKIE_SECURE:false}
app.jwtAccessCookieName= testAccess
app.jwtRefreshCookieName= testRefresh
app.jwtSecret= VGhpc0lzQVN1ZmZpY2llbnRseUxvbmdTZWNyZXRGb3JUZXN0aW5nMTIzNDU2Nzg5MA
app.jwtExpirationAccessMs= 900000
app.jwtExpirationRefreshMs= 604800000

logging.level.org.project=ERROR